  #   image: postgres:16
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-postgres}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  #     POSTGRES_DB: ${POSTGRES_DB:-pawzitively_dev}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    # depends_on:
    #   db:
    #     condition: service_healthy
    # environment:
    #   POSTGRES_USER: ${POSTGRES_USER:-postgres}
    #   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    #   POSTGRES_DB: ${POSTGRES_DB:-pawzitively_dev}
    #   POSTGRES_HOST: db
    env_file:
      - .env
    # Use the host's network stack so the container can reach the Postgres
    # already running on the host (dev.exs connects to "0.0.0.0" => localhost).
    # With host networking the app's port 4000 binds directly to the host,
    # so an explicit `ports:` mapping is unnecessary.
    network_mode: host
    volumes:
      # Bind-mount the source for live code reloading...
      - .:/app
      # ...but keep build artifacts and deps in the container (named volumes)
      # so the host mount doesn't shadow them.
      - build:/app/_build
      - deps:/app/deps
    stdin_open: true
    tty: true

volumes:
  # pg_data:
  build:
  deps:
